<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Circle background -->
  <circle cx="100" cy="100" r="96" fill="#111111"/>

  <!-- Sky / light area top -->
  <clipPath id="circle-clip">
    <circle cx="100" cy="100" r="94"/>
  </clipPath>

  <!-- Road surface (dark) -->
  <g clip-path="url(#circle-clip)">
    <!-- Background fill -->
    <rect x="6" y="6" width="188" height="188" fill="#1a1a1a"/>

    <!-- Road trapezoid -->
    <polygon points="100,30 140,180 60,180" fill="#222222"/>

    <!-- Road edges (subtle) -->
    <polygon points="100,30 142,182 138,182 100,34" fill="#2a2a2a"/>
    <polygon points="100,30 62,182 58,182 100,34" fill="#2a2a2a"/>

    <!-- Left yellow line -->
    <polygon points="100,32 85,182 81,182 100,38" fill="#D4A017"/>
    <!-- Right yellow line -->
    <polygon points="100,32 115,182 119,182 100,38" fill="#D4A017"/>

    <!-- Ground / sides -->
    <polygon points="6,182 60,182 100,30 6,30" fill="#1e1e1e"/>
    <polygon points="194,182 140,182 100,30 194,30" fill="#1e1e1e"/>

    <!-- Horizon glow -->
    <ellipse cx="100" cy="34" rx="18" ry="5" fill="#3a3020" opacity="0.8"/>
  </g>

  <!-- Circle border -->
  <circle cx="100" cy="100" r="96" stroke="#333" stroke-width="1"/>

  <!-- Р-217 text -->
  <text x="100" y="80" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="1">Р-217</text>

  <!-- МАГИСТРАЛЬ text below circle -->
  <text x="100" y="225" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="26" fill="#111111" letter-spacing="3">МАГИСТРАЛЬ</text>
</svg>
